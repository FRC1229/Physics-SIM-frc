# Where the real robot code lives. The simulator compiles that code directly
# (nothing is copied), so it always tests your latest robot code.
# A relative path is from this folder: "../Rebuilt" = a "Rebuilt" folder next to
# this one. On another computer, put the two folders side by side, or set the
# ROBOT_PROJECT_DIR environment variable instead of editing this file.
robotProjectDir=../Rebuilt
